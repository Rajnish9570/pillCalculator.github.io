
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pill Calculator</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f0f4f8;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 420px;
      margin: 30px auto;
      padding: 25px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 5px 20px #00000012;
    }

    h2 {
      text-align: center;
      color: #1769aa;
      margin-top: 0;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin: 15px 0 7px;
      font-weight: bold;
      color: #333;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccd5df;
      border-radius: 8px;
      font-size: 16px;
    }

    input:focus {
      outline: 2px solid #90caf9;
      border-color: #1769aa;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 22px;
      background: #1769aa;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 17px;
      cursor: pointer;
    }

    button:hover {
      background: #0d4f86;
    }

    .result {
      display: none;
      margin-top: 22px;
      padding: 18px;
      background: #e8f5e9;
      border-radius: 10px;
      text-align: center;
    }

    .result h3 {
      color: #24743a;
      margin: 0 0 10px;
    }

    .total {
      font-size: 36px;
      font-weight: bold;
      color: #1769aa;
      margin: 10px 0;
    }

    .error {
      color: #c62828;
      margin-top: 15px;
      text-align: center;
    }

    .note {
      color: #666;
      font-size: 12px;
      line-height: 1.5;
      margin-top: 20px;
    }
  </style>
</head>

<body>
  <div class="container">
    <h2>💊 Pill Calculator</h2>
    <p class="subtitle">Calculate your total tablets</p>

    <form id="pillForm">
      <label for="morning">Morning dose (tablets)</label>
      <input type="number" id="morning"
             min="0" max="100" step="0.5"
             value="1" required>

      <label for="evening">Evening dose (tablets)</label>
      <input type="number" id="evening"
             min="0" max="100" step="0.5"
             value="1" required>

      <label for="night">Night dose (tablets)</label>
      <input type="number" id="night"
             min="0" max="100" step="0.5"
             value="0" required>

      <label for="duration">Duration (days)</label>
      <input type="number" id="duration"
             min="1" max="3650" step="1"
             value="7" required>

      <button type="submit">Calculate Tablets</button>
    </form>

    <div class="result" id="result" aria-live="polite">
      <h3>Total Tablets Required</h3>
      <div class="total" id="total">14</div>
      <p id="details"></p>
    </div>

    <p class="error" id="error" role="alert"></p>

    <p class="note">
      Note: Enter doses in tablets per dose, not milligrams.
      Follow your doctor's prescribed dose. This calculator
      only estimates the total quantity needed.
    </p>
  </div>

  <script>
    const form = document.getElementById("pillForm");

    form.addEventListener("submit", function (event) {
      event.preventDefault();

      const morning = Number(
        document.getElementById("morning").value
      );
      const evening = Number(
        document.getElementById("evening").value
      );
      const night = Number(
        document.getElementById("night").value
      );
      const duration = Number(
        document.getElementById("duration").value
      );

      const error = document.getElementById("error");
      const result = document.getElementById("result");

      error.textContent = "";
      result.style.display = "none";

      const doses = [morning, evening, night];

      if (
        doses.some(dose => !Number.isFinite(dose) ||
          dose < 0 || dose > 100) ||
        !Number.isInteger(duration) ||
        duration < 1 || duration > 3650
      ) {
        error.textContent =
          "Please enter valid doses and duration.";
        return;
      }

      const dailyTotal = morning + evening + night;
      const totalTablets = dailyTotal * duration;

      document.getElementById("total").textContent =
        Number(totalTablets.toFixed(4)).toLocaleString();

      document.getElementById("details").textContent =
        `${dailyTotal} tablets per day × ${duration} days`;

      result.style.display = "block";
    });
  </script>
</body>
</html>
